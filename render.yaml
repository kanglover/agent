# Render 蓝图（Blueprint）
#
# 本仓库是 monorepo，问数智能体在 projects/ec_bot 下，因此每个服务都用 rootDir 指过去。
# 用法：Render 控制台 → New → Blueprint → 选本仓库，会自动读取这个文件。
#
# 部署分支说明：
#   当前部署走的是 deploy/render-vercel 分支（尚未合并回 main）。
#   等你把该分支合并进 main 之后，把下面 service 里的 branch 改成 main 即可。

services:
  # 后端 API：免费 Docker 实例，取值召回走 MySQL 全文索引，不依赖 Elasticsearch
  - type: web
    name: ec-bot-api
    runtime: docker
    plan: free
    region: singapore
    branch: deploy/render-vercel
    rootDir: projects/ec_bot
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # 大模型网关
      - key: MODEL_NAME
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_API_BASE
        sync: false
      # 元数据库（托管 MySQL：Aiven / TiDB Cloud 等）
      - key: META_DB_HOST
        sync: false
      - key: META_DB_PORT
        sync: false
      - key: META_DB_USER
        sync: false
      - key: META_DB_PASSWORD
        sync: false
      - key: META_DB_NAME
        value: meta
      # 免费实例连接数很紧，meta 与 dw 各留 3 条即可
      - key: META_DB_POOL_SIZE
        value: 3
      # 托管 MySQL 强制 TLS
      - key: META_DB_SSL
        value: true
      # Aiven 用自签 CA，系统信任库里没有，开启证书链校验会直接连不上
      # （CERTIFICATE_VERIFY_FAILED: self-signed certificate in certificate chain）。
      # 这里跳过校验、保留链路加密；升级方式见 docs/DEPLOY_RENDER_VERCEL.md
      - key: DB_SSL_VERIFY
        value: false
      # 数仓库（可与元数据库同实例，仅库名不同）
      - key: DW_DB_HOST
        sync: false
      - key: DW_DB_PORT
        sync: false
      - key: DW_DB_USER
        sync: false
      - key: DW_DB_PASSWORD
        sync: false
      - key: DW_DB_NAME
        value: dw
      - key: DW_DB_POOL_SIZE
        value: 3
      - key: DW_DB_SSL
        value: true
      # Qdrant Cloud 托管集群
      - key: QDRANT_PROVIDER
        value: cloud
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_PORT
        value: 6333
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_USE_HTTPS
        value: true
      # Embedding 换成 OpenAI 兼容接口，免去本地加载 1GB+ 模型
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: EMBEDDING_MODEL
        sync: false
      - key: EMBEDDING_API_KEY
        sync: false
      - key: EMBEDDING_API_BASE
        sync: false
      - key: EMBEDDING_SIZE
        value: 1024
      # 取值召回走 MySQL 全文索引
      - key: VALUE_STORE_PROVIDER
        value: mysql
      # 前后端分离：前端在 Vercel，必须放行其域名，否则浏览器拦截跨域请求
      # 填 Vercel 正式域名；多个用英文逗号分隔
      - key: CORS_ALLOW_ORIGINS
        sync: false
      # 可选：放行 Vercel 预览域名，值为 https://ec-bot-.*\.vercel\.app
      - key: CORS_ALLOW_ORIGIN_REGEX
        sync: false
      # 容器内不写文件日志，统一走标准输出
      - key: LOG_FILE_ENABLE
        value: false

# 说明：前端是独立仓库/独立部署，托管在 Vercel（配置见 frontend/vercel.json），
# 因此这里只保留后端一个服务。前端构建时通过 VITE_API_BASE_URL 指向本服务的地址。
